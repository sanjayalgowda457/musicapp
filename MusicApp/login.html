<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login | Gana Music</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      background: url('https://images.unsplash.com/photo-1544785349-c4a5301826fd?auto=format&fit=crop&q=60&w=1920') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Montserrat', sans-serif;
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      position: relative;
    }
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 0;
    }
    .login-container {
      background-color: rgba(28, 28, 28, 0.95);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      width: 350px;
      text-align: center;
      position: relative;
      z-index: 1;
    }
    h2 {
      color: #7e57c2;
      margin-bottom: 30px;
      font-size: 26px;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 10px;
      background-color: #2a2a2a;
      color: white;
      font-size: 14px;
    }
    button {
      background-color: #7e57c2;
      color: white;
      padding: 12px;
      margin-top: 20px;
      width: 100%;
      border: none;
      border-radius: 30px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background-color: #a879d4;
    }
    .error {
      color: #ff4d4d;
      margin-top: 10px;
      font-size: 14px;
    }
    .switch {
      margin-top: 20px;
      font-size: 14px;
    }
    .switch a {
      color: #7e57c2;
      text-decoration: none;
      font-weight: bold;
    }
    .switch a:hover {
      text-decoration: underline;
    }
    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid #7e57c2;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
      display: none;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Gana Music</h2>
    <form id="loginForm">
      <input type="text" id="email" placeholder="Email" required><br>
      <input type="password" id="password" placeholder="Password" required><br>
      <button type="submit">Log In</button>
    </form>
    <div class="spinner" id="loaderSpinner"></div>
    <div class="error" id="errorMsg"></div>
    <div class="switch">No account? <a href="register.html">Register here</a></div>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const spinner = document.getElementById("loaderSpinner");

      document.getElementById("errorMsg").innerText = "";

      if (!email || !password) {
        document.getElementById("errorMsg").innerText = "Please enter email and password.";
        return;
      }

      spinner.style.display = "block";

      try {
        const res = await fetch("https://kizkewy4zb.execute-api.us-east-1.amazonaws.com/default/lambda_login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();
        if (res.status === 200) {
          localStorage.setItem("user_name", data.user_name);
          localStorage.setItem("email", data.email);
          window.location.href = "main.html";
        } else {
          document.getElementById("errorMsg").innerText = data.error || "Login failed. Try again.";
        }
      } catch (err) {
        document.getElementById("errorMsg").innerText = "Error: " + err.message;
      } finally {
        spinner.style.display = "none";
      }
    });
  </script>
</body>
</html>
